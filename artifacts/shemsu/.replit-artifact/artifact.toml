kind = "web"
previewPath = "/"
title = "SHEMSU Marketplace"
description = "A mobile-first Ethiopian and African marketplace with swipe-to-shop discovery, real product browsing, favorites, cart, demo checkout, accounts, and seller tools backed by persistent storage."
version = "1.0.0"
id = "artifacts/shemsu"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21292

[services.development]
run = "pnpm --filter @workspace/shemsu run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shemsu", "run", "build" ]
serve = "static"
publicDir = "artifacts/shemsu/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21292"
BASE_PATH = "/"
